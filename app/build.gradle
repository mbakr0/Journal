plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}
apply plugin: 'androidx.navigation.safeargs.kotlin'

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()

// Load the properties file ONLY if it exists (which it does in CI after restoration)
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    // Optionally print a warning if running locally without the key file
    println "Warning: key.properties not found. Using local debug key."
}

android {
    namespace 'online.mohmedbakr.newsfeed'
    compileSdk 37

    defaultConfig {
        applicationId "online.mohmedbakr.newsfeed"
        minSdk 26
        //noinspection EditedTargetSdkVersion,OldTargetApi
        targetSdk 36
        versionCode 403
        versionName "4.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Point the CI build to the restored JKS file path
            storeFile rootProject.file('app/upload-keystore.jks')
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'

    //  Constraint Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    //  Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    //  Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    // Note: lifecycle-common-java8 is an annotation processor/library that no longer requires kapt or ksp in modern Lifecycle versions
    implementation "androidx.lifecycle:lifecycle-common-java8:2.11.0"

    //  Room For database
    implementation("androidx.room:room-runtime:2.8.4")
    implementation("androidx.room:room-ktx:2.8.4")
    ksp("androidx.room:room-compiler:2.8.4")

    //  Preferences DataStore
    implementation("androidx.datastore:datastore-preferences:1.2.1")

    //  RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    //  Glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    ksp 'com.github.bumptech.glide:ksp:5.0.9'

    //  Parsing XML
    implementation 'stax:stax:1.2.0'
    implementation 'com.fasterxml:aalto-xml:1.4.0'
    implementation "org.apache.poi:poi-ooxml:5.5.1"
    implementation "org.apache.xmlbeans:xmlbeans:5.3.0"

    // Shimmer Effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0@aar'

    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.2.0"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}